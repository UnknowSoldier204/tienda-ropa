<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda de Ropa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .producto {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 10px;
      text-align: center;
      background-color: #fff;
      width: 200px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .productos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .producto img {
      max-width: 100%;
      border-radius: 5px;
    }
    .precio {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Tienda de Ropa</h1>
  <div class="productos">
    <div class="producto">
      <img src="https://via.placeholder.com/150" alt="Camiseta Blanca">
      <h2>Camiseta Blanca</h2>
      <p class="precio">$199 MXN</p>
      <button>Agregar al carrito</button>
    </div>
    <div class="producto">
      <img src="https://via.placeholder.com/150" alt="Jeans Clásicos">
      <h2>Jeans Clásicos</h2>
      <p class="precio">$499 MXN</p>
      <button>Agregar al carrito</button>
    </div>
    <!-- Puedes agregar más productos igual -->
  </div>

</body>
</html>
